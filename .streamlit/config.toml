# Streamlit settings for the web edition (streamlit_app.py)

[server]
# No port here: Streamlit Cloud must use its default 8501. Locally run_streamlit.bat uses 8765.
headless = true             # do not ask for an e-mail on first start
runOnSave = false

[browser]
gatherUsageStats = false    # nothing is sent to Streamlit

[theme]
base = "dark"
primaryColor = "#38BDF8"            # sky blue, same as the desktop app
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#172033"
textColor = "#F8FAFC"
font = "sans serif"

[client]
toolbarMode = "minimal"
